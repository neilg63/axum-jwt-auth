[package]
name = "axum-jwt-bridge"
version = "0.1.0"
edition = "2024"
description = "JWT encode/decode for Axum: HS256 shared-secret or EdDSA (Ed25519) public/private key auth, with optional Laravel interop and multi-issuer support"
license = "MIT"
repository = "https://github.com/neilg63/axum-jwt-bridge"
documentation = "https://docs.rs/axum-jwt-bridge"
readme = "README.md"
keywords = ["axum", "jwt", "authentication", "laravel"]
categories = ["web-programming", "authentication"]

[dependencies]
jsonwebtoken = { version = "^10.3", features = ["rust_crypto"] }
serde = { version = "1", features = ["derive"] }
axum = "0.8"
http = "1"
sha1 = "0.10"
rand = "0.10"
thiserror = "2"

[dev-dependencies]
tokio = { version = "1", features = ["full", "test-util"] }
dotenvy = "0.15"